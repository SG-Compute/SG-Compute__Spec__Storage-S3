# ═══════════════════════════════════════════════════════════════════════════════
# CI Pipeline (Base — reusable)
#
# Called by ci-pipeline__dev.yml (push to dev → minor bump)
#        and ci-pipeline__main.yml (push to main → major bump).
#
# Jobs:
#   1. run-unit-tests   — pytest over both test packages
#   2. increment-tag    — version bump + git tag (dev/main only)
# ═══════════════════════════════════════════════════════════════════════════════

name: CI Pipeline (Base)

on:
  workflow_call:
    inputs:
      git_branch:
        required: true
        type: string
      release_type:
        required: false
        type: string
        default: ""
      should_increment_tag:
        required: false
        type: boolean
        default: false

env:
  PACKAGE_NAME : 'sg_compute_specs'
  GIT__BRANCH  : ${{ inputs.git_branch }}

permissions:
  contents: write                                                                  # required by increment-tag to push version-bump commit + tag

jobs:

  # ════════════════════════════════════════════════════════════════════════════
  # Job 1: Unit Tests (no Docker, no AWS)
  # ════════════════════════════════════════════════════════════════════════════
  run-unit-tests:
    name: "Run Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: |
          pip install poetry-core                                                    # required to build sgraph-ai-service-playwright from git source
          pip install -r requirements.txt
          pip install pytest pytest-timeout httpx
          pip install -e .

      - name: Run sg_compute tests
        timeout-minutes: 5
        run: python -m pytest sg_compute__tests/ -v --timeout=30

      - name: Run sg_s3_server tests
        timeout-minutes: 5
        run: python -m pytest sg_s3_server__tests/ -v --timeout=30

  # ════════════════════════════════════════════════════════════════════════════
  # Job 2: Increment Tag    [dev = patch bump, main = minor bump]
  #   Bumps sg_compute_specs/s3_server/version and pyproject.toml.
  #   Only runs on push to dev or main (not on PRs or other branches).
  #   Gated on run-unit-tests so a failing test never burns a version number.
  # ════════════════════════════════════════════════════════════════════════════
  increment-tag:
    name: "Increment Tag (dev=minor, main=major)"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [run-unit-tests]
    if: |
      inputs.should_increment_tag == true &&
      github.event_name == 'push' &&
      (github.ref_name == 'dev' || github.ref_name == 'main')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Increment Tag
        uses: owasp-sbot/OSBot-GitHub-Actions/.github/actions/git__increment-tag@dev
        with:
          release_type: ${{ inputs.release_type }}
